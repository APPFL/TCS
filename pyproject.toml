[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appfl-tcs"
version = "0.1.0"
description = "Trajectory Consistency-based Stopping for APPFL"
authors = [{name = "Seok-Ju Hahn"}, {name = "Kibaek Kim"}]
requires-python = ">=3.10"
dependencies = ["appfl>=1.12.0", "torch", "omegaconf", "numpy"]

[project.optional-dependencies]
examples = ["torchvision", "pyyaml"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/APPFL/TCS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
